name: release

# Tag a commit to cut a release:
#   git tag v1.0.0 && git push origin v1.0.0
# Installers for every platform are built and attached to a DRAFT release,
# which you review and publish by hand from the Releases page.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  installers:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
          - platform: ubuntu-22.04
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Markdown Viewer ${{ github.ref_name }}'
          releaseBody: |
            Download the installer for your platform below.

            **Windows** — `.exe` installer. Windows SmartScreen will warn that the
            publisher is unknown because the build is not code-signed: click
            **More info**, then **Run anyway**.

            **macOS** — `.dmg`. Unsigned, so on first launch right-click the app and
            choose **Open**, then confirm.

            Also attached: `Markdown Viewer.html`, the whole app as one file you can
            open in any browser with no installation at all.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  standalone-html:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: installers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Attach the single-file build to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: false
          files: 'dist/Markdown Viewer.html'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
